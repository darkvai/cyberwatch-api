<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberWatch Monitoring System</title>
    <link rel="stylesheet" href="styles.css"> 
</head>
<body>

    <div class="container">
        
        <header>
            <div class="brand">
                <div class="logo-box"></div>
                <div class="brand-text">
                    <h1>CyberWatch</h1>
                    <span>Monitoring System</span>
                </div>
            </div>
            <div class="user-profile">
                <span><a href="/profile"></a></span>
                <div class="profile-circle"></div>
            </div>
        </header>

        <nav>
            <ul>
                <li><a href="/dashboard" class="active">Dashboard 📊 </a></li>
                <li><a href="#" id="Create-tick">Create ticket 🎟️ </a></li>
                <li><a href="/logs">Track Logs 📜 </a></li>
            </ul>
        </nav>

        <section class="stats-container">
            <div class="stat-card">
                <h3>Total Tickets:</h3>
                <div class="number-tick">#Number</div>
            </div>

            <div class="stat-card">
                <h3>unresolved</h3>
                <div class="number-open">#Number</div>
            </div>

            <div class="stat-card">
                <h3>Resolved</h3>
                <div class="number-res">#Number</div>
            </div>
            
            <div class="chart"></div>
        </section>

        <section class="ticket-table">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3>Active Security Tickets</h3>
                
                <div class="filter-box">
                    <label for="ticketFilter" style="margin-right: 10px; font-weight: bold;">Filter Severity:</label>
                    <select id="ticketFilter" onchange="applyTicketFilter()" style="padding: 5px; border: 1px solid #333;">
                        <option value="all">Show All</option>
                        <option value="critical">Critical</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>
            </div>
            <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Ticket ID</th>
                        <th>Analyst ID</th>
                        <th>Title</th>
                        <th>Status</th>
                        <th>Severity</th>
                        <th>Asset ID</th>
                        <th>Created at</th>
                        <th>Description</th>
                        <th>Action</th>
                
                        
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
            </div>
        </section>

        <div class="footer">
            <span>Showing 1 of 100 entries</span>
            <div class="index_buttons">
                <button>Previous</button>
                <button >1</button>
                <button>2</button>
                <button>3</button>
                <button>4</button>
                <button>5</button>
                <button>Next</button>

            </div>
        </div>

    </div>
    <!-----  TICKET CREATION FORM  -->
    <div id="ticketModal" class="modal-overlay">
        
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            
            <h2>Create Ticket</h2>
            <form class="form" id="ticketForm" action="/incidents" method="post">
    
            <label for="title">Title</label>
            <input type="text" id="title" name="title" placeholder="Issue title..." required>



            <label for="asset">Affected Asset</label>
                <select id="asset" name="asset_id" style="width:100%; margin-bottom:10px; padding: 8px;" required>
    <!-- Options will be injected here by Javascript -->
                </select>


            <label for="description">Description</label>
            <textarea id="Description" name="description" placeholder="Describe the incident details..." required rows="3"></textarea>

            <label for="severity">Severity</label>
            <select id="severity" name="severity" style="width:100%; margin-bottom:10px; padding: 8px;">
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
                <option value="Critical">Critical</option>
            </select>

            <button type="submit" class="submit-btn" id="submitBtn">Submit</button>
        </form>
        </div>

    </div>
 

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<script src="app.js"></script>
</body>
</html>
