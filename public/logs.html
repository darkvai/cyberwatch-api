<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="styles.css"> 
    <title>Log viewer:</title>
</head>
<body>
        <div class="container">
        
        <header>
            <div class="brand">
                <div class="logo-box"></div>
                <div class="brand-text">
                    <h1>CyberWatch</h1>
                    <span>Monitoring System</span>
                </div>
            </div>
            <div class="user-profile">
                <span><a href="/profile"></a></span>
                <div class="profile-circle"></div>
            </div>
        </header>

        <nav>
            <ul>
                <li><a href="/dashboard" >Dashboard 📊 </a></li>
                <li><a href="#" id="Create-tick">Create ticket 🎟️ </a></li>
                <li><a href="/logs" class="active">Track Logs 📜 </a></li>
            </ul>
        </nav>
        <div class="terminal">
            <H1>LIVE LOG VIEWER 🔴 :</H1>
            <pre id="logs_display"></pre>
        </div>
        <div id="ticketModal" class="modal-overlay">
        
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            
            <h2>Create Ticket</h2>
            <form class="form" id="ticketForm" action="/incidents" method="post">
    
            <label for="title">Title</label>
            <input type="text" id="title" name="title" placeholder="Issue title..." required>



            <label for="asset">Affected Asset</label>
<select id="asset" name="asset_id" style="width:100%; margin-bottom:10px; padding: 8px;" required>
    <!-- Options will be injected here by Javascript -->
</select>


            <label for="description">Description</label>
            <textarea id="Description" name="description" placeholder="Describe the incident details..." required rows="3"></textarea>
            <label for="severity">Severity</label>
            <select id="severity" name="severity" style="width:100%; margin-bottom:10px; padding: 8px;">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
                <option value="critical">Critical</option>
            </select>

            <button type="submit" class="submit-btn" id="submitBtn" href="/dashboard">Submit</button>
        </form>
        </div>

        </div>
<script src="app.js"></script>
</body>
</html>
